<title>Mente MV</title>
<style>/* ═══ MENTE MV · estilo Hume, familia Fitness MV, champaña ═══ */
:root{
  --ch:#D6C2A1; --ch-hi:#F0E4CC; --ch-deep:#8A6A4F; --onix:#0E0C0A;
  --f1:#8A6A4F; --f2:#B87561; --f3:#EADFC8; --fase:#8A6A4F;
  --t1:#F6F2EA; --t2:rgba(246,242,234,.68); --t3:rgba(246,242,234,.46); --t4:rgba(246,242,234,.24);
  --glass:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.045) 55%,rgba(255,255,255,.03));
  --rim:linear-gradient(165deg,rgba(255,255,255,.42),rgba(255,255,255,.07) 36%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.16));
  --blur:blur(22px) saturate(150%);
  --lift:0 24px 48px -18px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--onix);height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--t1);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font-family:var(--font);color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font-family:var(--font);-webkit-user-select:text;user-select:text}

/* fondo: ónix + pinceladas champaña diagonales, opacas */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(120% 70% at 50% 24%,rgba(58,46,30,.85) 0%,rgba(18,16,14,.6) 55%,transparent 100%),
   repeating-linear-gradient(118deg,transparent 0 46px,rgba(214,194,161,.022) 46px 48px,transparent 48px 120px),
   repeating-linear-gradient(118deg,transparent 0 180px,rgba(214,194,161,.035) 180px 200px,transparent 200px 330px),
   var(--onix)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 50% at 50% 100%,rgba(0,0,0,.7),transparent 70%)}

#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 110px);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.screen::-webkit-scrollbar{display:none}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ch);opacity:.85}
.eyebrow b{color:var(--fase);font-weight:600}
.title{font-size:28px;font-weight:300;letter-spacing:-.02em;margin-top:4px}
.title b{font-weight:600}
.sub{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.35}
.lbl{font-size:14.5px;font-weight:500}
.mini{font-size:10.5px;color:var(--t3);letter-spacing:.04em}

.g{position:relative;border-radius:26px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--lift);padding:16px 18px}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--rim);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.g.flat{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;background:rgba(255,255,255,.045)}
.g.accent::before{background:linear-gradient(165deg,var(--fase),rgba(255,255,255,.05) 45%,rgba(255,255,255,.12))}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ico{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:19px;background:rgba(214,194,161,.12);flex:none}
.x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--t2);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);flex:none}
.g > .x{position:absolute;top:12px;right:12px;width:26px;height:26px;font-size:10px;z-index:2}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:var(--t1);transition:all .2s var(--ease)}
.chip.on{background:rgba(214,194,161,.2);border-color:var(--ch);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.btn{display:block;width:100%;border-radius:22px;padding:16px;text-align:center;font-weight:600;font-size:15px;color:#17130d;background:linear-gradient(180deg,#F2E6CC,#C9B086);box-shadow:0 10px 30px -10px rgba(214,194,161,.5)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--t1);box-shadow:none;border:1px solid rgba(255,255,255,.12);font-weight:500}
.btn.done{background:rgba(214,194,161,.14);color:var(--ch-hi);box-shadow:none;border:1px solid rgba(214,194,161,.35)}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:12px;color:#17130d;flex:none}
.check.on{background:var(--ch);border-color:var(--ch)}
.tag{font-size:10px;padding:4px 9px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--t2);letter-spacing:.04em}

/* dial */
.dialwrap{display:flex;justify-content:center;margin:12px 0 6px;position:relative}
.dial{width:300px;height:300px;max-width:82vw;max-height:82vw}
.dial text{font-family:var(--font)}

/* slider con perilla */
.slider{position:relative;height:30px;margin-top:8px;touch-action:none}
.slider .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:6px;background:rgba(255,255,255,.08)}
.slider .fill{position:absolute;left:0;top:12px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--ch-deep),#E6D3B0)}
.slider .knob{position:absolute;top:15px;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);background:#F3E8D2;box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.7);transition:left .15s var(--ease)}
.slider .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin-top:28px}

/* lunas */
.lunas{display:flex;justify-content:space-between;margin-top:12px}
.lunas button{font-size:27px;opacity:.32;transition:all .25s var(--ease);padding:4px}
.lunas button.on{opacity:1;transform:scale(1.15);filter:drop-shadow(0 0 10px rgba(234,223,200,.55))}

/* nav flotante */
.nav{position:fixed;bottom:calc(var(--safe-b) + 18px);left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;padding:7px;border-radius:32px;background:rgba(20,18,15,.72);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.nav button{width:52px;height:42px;border-radius:22px;display:grid;place-items:center;font-size:17px;opacity:.5;transition:all .25s var(--ease)}
.nav button.on{opacity:1;background:rgba(214,194,161,.18)}

/* hoja (bottom sheet) */
.veil{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:480px;margin:0 auto;max-height:92%;overflow-y:auto;border-radius:32px 32px 0 0;
  background:linear-gradient(180deg,rgba(38,32,24,.97),rgba(16,14,12,.98));border-top:1px solid rgba(214,194,161,.25);
  padding:16px 20px calc(var(--safe-b) + 26px);transform:translateY(105%);transition:transform .38s var(--ease)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 12px}
.sheet h2{font-size:24px;font-weight:300;letter-spacing:-.02em}
.sheet h2 b{font-weight:600}
.sec{margin-top:16px}
.sec > .mini{margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.16em}

/* pasos */
.paso{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);transition:opacity .3s}
.paso:last-child{border-bottom:0}
.paso .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:rgba(255,255,255,.07);color:var(--t2);flex:none}
.paso.now .n{background:var(--ch);color:#17130d}
.paso.past{opacity:.45}
.paso .m{font-size:11px;color:var(--t3);margin-left:auto;font-variant-numeric:tabular-nums;flex:none}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;margin:8px 0 4px}
.timer svg{width:170px;height:170px}
.timer .t{font-size:34px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tbtns{display:flex;gap:8px;margin-top:10px;width:100%}
.tbtns .btn{padding:13px;font-size:14px}

/* flama */
.flama{position:relative;width:120px;height:170px;margin:4px auto 0}
.flama .cera{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34px;height:62px;border-radius:6px 6px 4px 4px;background:linear-gradient(90deg,#d9cdb6,#f3ead9 45%,#bfb196)}
.flama .mecha{position:absolute;bottom:62px;left:50%;width:2px;height:8px;background:#2a2118;transform:translateX(-50%)}
.flama .fuego{position:absolute;bottom:68px;left:50%;width:26px;height:58px;transform:translateX(-50%);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 72%,#fff 0%,#ffe9a8 22%,#ffb347 52%,rgba(255,120,40,.0) 75%);filter:blur(.6px);animation:titila 2.4s ease-in-out infinite;transform-origin:50% 100%}
.flama .halo{position:absolute;bottom:60px;left:50%;width:160px;height:160px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.28),transparent 65%);animation:halo 3.2s ease-in-out infinite}
@keyframes titila{0%,100%{transform:translateX(-50%) scale(1,1) skewX(0)}25%{transform:translateX(-50%) scale(.96,1.05) skewX(1.5deg)}50%{transform:translateX(-50%) scale(1.03,.97) skewX(-1deg)}75%{transform:translateX(-50%) scale(.98,1.03) skewX(.8deg)}}
@keyframes halo{0%,100%{opacity:.85}50%{opacity:1}}
.flama.off .fuego,.flama.off .halo{opacity:.25;animation:none}

/* fases */
.ph{display:flex;gap:6px;margin-top:12px}
.ph i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.ph i span{position:absolute;inset:0;right:auto}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;border-radius:4px}

/* registro */
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:10px}
.grid28 div{aspect-ratio:1;border-radius:9px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:10px;color:var(--t3)}
textarea.in,input.in{width:100%;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--t1);padding:12px 14px;font-size:14px;resize:none;outline:none}
textarea.in:focus,input.in:focus{border-color:var(--ch)}

.toast{position:fixed;top:calc(var(--safe-t) + 14px);left:50%;transform:translate(-50%,-30px);z-index:20;padding:10px 16px;border-radius:20px;background:rgba(30,26,20,.92);border:1px solid rgba(214,194,161,.3);font-size:13px;opacity:0;transition:all .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.credo{text-align:center;padding:22px 18px}
.credo .c1{font-size:20px;font-weight:300;letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
.hidden{display:none!important}

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act],[data-tab]'); if (!el) return;
    if (el.dataset.tab) { tab = el.dataset.tab; render(); $('#' + tab).scrollTop = 0; return; }
    var a = el.dataset.act, b = el.dataset.b, k = el.dataset.k, v = el.dataset.v;
    switch (a) {
      case 'abrir': if (b === 'm') hojaManana(); else if (b === 'i') hojaIntelecto(); else hojaNoche(); break;
      case 'invivo': hojaInVivo(); break;
      case 'invivo-libre': hojaInVivo(); break;
      case 'valores': hojaValores(); break;
      case 'cerrar': cerrarHoja(); break;
      case 'ocultar': S.ocultar = S.ocultar || {}; S.ocultar[k] = 1; guardar(); render(); break;
      case 'timer': iniciarTimer(el.dataset.id, +el.dataset.s); break;
      case 'timer-reset': T = null; T = { id: el.dataset.id, total: +el.dataset.s, acum: 0, corriendo: false }; pintarTimer(); var bt = document.querySelector('[data-timer="' + el.dataset.id + '"] [data-act="timer"]'); if (bt) bt.textContent = '▶︎ Iniciar'; break;
      case 'valor': B('m').valor = +el.dataset.i; guardar(); refrescarHoja(); break;
      case 'toggle': B(b)[k] = !B(b)[k]; guardar(); refrescarHoja(); break;
      case 'set': B(b)[k] = B(b)[k] === v ? null : v; guardar(); refrescarHoja(); break;
      case 'multi': var arr = B(b)[k] || []; var ix = arr.indexOf(v); if (ix >= 0) arr.splice(ix, 1); else arr.push(v); B(b)[k] = arr; guardar(); refrescarHoja(); break;
      case 'luna': var n = B('n'); n.luna = n.luna === +el.dataset.i ? null : +el.dataset.i; guardar(); refrescarHoja(); break;
      case 'corazon': var ay = B('n', MM.add(HOY, -1)); ay.corazonRes = ay.corazonRes === v ? null : v; guardar(); refrescarHoja(); break;
      case 'sen': var nn = B('n'); nn.sen = nn.sen || []; var si = nn.sen.indexOf(+el.dataset.i); if (si >= 0) nn.sen.splice(si, 1); else nn.sen.push(+el.dataset.i); guardar(); refrescarHoja(); break;
      case 'hecho':
        var bb = B(b); bb.done = !bb.done; bb.t = bb.done ? new Date().toISOString() : null;
        if (b === 'm' && bb.pres == null) bb.pres = 3;
        guardar();
        if (bb.done) { toast(b === 'n' ? '🦅 Día cerrado. ' + P.credo.t : '✓ ' + ({ m: '🧘 Conciencia', i: '📖 Intelecto' }[b]) + ' hecho'); cerrarHoja(); } else refrescarHoja();
        break;
      case 'ivemo': var vv = B('v'); vv.emo = v; var ff = F(); var nv = ff.key === 'F1' ? 0 : ff.key === 'F2' ? 1 : 2; vv.reto = P.invivo.escalera[v][nv]; guardar(); refrescarHoja(); break;
      case 'ivluna': var v2 = B('v'); v2[k] = v2[k] === +el.dataset.i ? null : +el.dataset.i; guardar(); refrescarHoja(); break;
      case 'ivdone': var v3 = B('v'); v3.done = !v3.done; if (!v3.emo) v3.emo = el.dataset.emo; if (!v3.reto) v3.reto = el.dataset.reto; guardar(); if (v3.done) { toast('🔥 Hecha. Eso es osadía.'); cerrarHoja(); } else refrescarHoja(); break;
      case 'export': exportar(); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.act === 'import' && el.files && el.files[0]) importar(el.files[0]);
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target, k = el.dataset.in; if (!k) return;
    if (k === 'orden-propia') { D(MM.add(HOY, 1)).ordenPropia = el.value.trim() || null; }
    else { var p = k.split('.'); B(p[0])[p[1]] = el.value; }
    guardar();
  });
  $('#veil').addEventListener('click', cerrarHoja);

  /* slider con perilla (toque y arrastre) */
  function sliderDesde(ev) {
    var sl = ev.target.closest('[data-slider]'); if (!sl) return null;
    return sl;
  }
  function moverSlider(sl, x) {
    var r = sl.getBoundingClientRect(), p = Math.max(0, Math.min(1, (x - r.left) / r.width));
    var val = Math.round(p * 4) + 1, pct = (val - 1) / 4 * 100;
    sl.querySelector('.fill').style.width = pct + '%'; sl.querySelector('.knob').style.left = pct + '%';
    B('m').pres = val; guardar();
  }
  var arrastre = null;
  document.addEventListener('pointerdown', function (ev) { var sl = sliderDesde(ev); if (!sl) return; arrastre = sl; moverSlider(sl, ev.clientX); });
  document.addEventListener('pointermove', function (ev) { if (arrastre) moverSlider(arrastre, ev.clientX); });
  document.addEventListener('pointerup', function () { arrastre = null; });

  function exportar() {
    var blob = new Blob([JSON.stringify({ app: 'MENTE MV', key: KEY, exportado: new Date().toISOString(), state: S }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mente-mv-respaldo-' + HOY + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('💾 Respaldo exportado');
  }
  function importar(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result), st = MM.migrar(j.state || j);
        Object.keys(st.dias).forEach(function (s) {
          var a = S.dias[s], b = st.dias[s];
          if (!a) { S.dias[s] = b; return; }
          ['m', 'i', 'n', 'v'].forEach(function (bk) {
            if (!b[bk]) return; if (!a[bk]) { a[bk] = b[bk]; return; }
            if ((b[bk].t || '') > (a[bk].t || '') || (!a[bk].done && b[bk].done)) a[bk] = b[bk];
          });
          if (b.ordenPropia && !a.ordenPropia) a.ordenPropia = b.ordenPropia;
        });
        guardar(); render(); toast('📥 Respaldo importado');
      } catch (e) { toast('⚠️ Archivo no válido'); }
    };
    r.readAsText(file);
  }

  /* cambio de día con la app abierta */
  setInterval(function () { var h = hoyStr(); if (h !== HOY) { HOY = h; if (!hojaActual) render(); } else if (!hojaActual && tab === 'hoy') renderHoy(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { HOY = hoyStr(); if (!hojaActual) render(); else pintarTimer(); if (T && T.corriendo) tick(); } });

  window.__MM_UI = { S: function () { return S; }, render: render, abrir: function (b) { if (b === 'v') hojaInVivo(); else if (b === 'valores') hojaValores(); else ({ m: hojaManana, i: hojaIntelecto, n: hojaNoche })[b](); }, cerrar: cerrarHoja, tab: function (t) { tab = t; render(); } };
  var q = /[?&]tab=(\w+)/.exec(location.search); if (q) tab = q[1];
  render();
})();
</script>
