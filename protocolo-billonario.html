function updateSimulador() {
  const ahorroEl  = document.getElementById('sim-ahorro');
  const ingresoEl = document.getElementById('sim-ingreso');
  const tasaEl    = document.getElementById('sim-tasa');
  if (!ahorroEl || !ingresoEl || !tasaEl) return;

  const ahorro  = parseInt(ahorroEl.value);
  const ingreso = parseInt(ingresoEl.value);
  const tasa    = parseInt(tasaEl.value) / 100;

  document.getElementById('sim-ahorro-val').textContent  = '$' + ahorro;
  document.getElementById('sim-ingreso-val').textContent = '$' + ingreso.toLocaleString('en-US');
  document.getElementById('sim-tasa-val').textContent    = (tasa * 100) + '%';

  DB.set('ui:simAhorro', ahorro);
  DB.set('ui:simIngreso', ingreso);
  DB.set('ui:simTasa', Math.round(tasa * 100));

  // Runway sept 26 = ahorro × 5
  const runwaySep = ahorro * 5;

  // Simulación mes a mes 60 meses
  let nw = calcCapitalRings().nw.valueUSD;
  let monthsTo50k = -1;
  const ahorroJob = ingreso * tasa;
  const annualRet = 0.07;
  const monthlyRet = annualRet / 12;
  const investUnlock = 50000;

  for (let m = 1; m <= 60; m++) {
    let saving;
    if (m <= 4) saving = ahorro;                                    // F1 (may-sep 26)
    else if (m <= 9) saving = ahorroJob * 0.7;                       // F2 transition (escalando)
    else saving = ahorroJob;                                         // F3+
    if (m === 9) nw -= 5000;                                         // mudanza
    if (m >= 24) saving *= 1.10;                                     // 2028+ asset escalable adds 10%
    nw += saving;
    if (nw > investUnlock) {
      nw += nw * monthlyRet;                                          // R5 unlock
    }
    if (monthsTo50k < 0 && nw >= investUnlock) monthsTo50k = m;
  }

  document.getElementById('sim-result-runway').textContent = '$' + runwaySep.toLocaleString('en-US') + ' USD';
  document.getElementById('sim-result-50k').textContent    = monthsTo50k > 0 ? '~' + monthsTo50k + ' meses' : '> 5 años';
  document.getElementById('sim-result-2032').textContent   = '$' + Math.round(nw / 1000) + 'K USD';
}

const ROUTE_STATES = {
  r1: ['inactiva','idea','validando','construyendo','operando','exit'],
  r2: ['idea','preparando','aplicando','reps','recurrente','éxito'],
  r3: ['idea','validando','construyendo','vendiendo','escalando'],
  r4: ['perfilando','postulando','entrevistando','negociando','onboarding','contratado','director'],
  r4b: ['perfilando','postulando','entrevistando','negociando','onboarding','contratado'],
  r5: ['🔒 bloqueada','activa','escalando']
};

function cycleRouteState(id) {
  const routes = DB.get('routes', ROUTES_DEFAULT);
  const r = routes.find(x => x.id === id);
  if (!r) return;
  if (r.locked) {
    alert(`Ruta ${r.num} está bloqueada${r.unlockAt ? ' hasta: ' + r.unlockAt : ''}. Desbloquéala desde Settings → Rutas si necesitas forzar.`);
    return;
  }
  const states = ROUTE_STATES[id] || r.stages || [];
  const i = states.indexOf(r.state);
  const next = states[(i + 1) % states.length];

  // Anti-placebo: cambio de estado de ruta requiere captura
  openPlaceboCapture({
    routeId: id,
    fromState: r.state,
    toState: next,
    onConfirm: (criterion, evidence) => {
      r.state = next;
      DB.set('routes', routes);
      // Log to accelerators for audit
      DB.push('accelerators', {
        id: uid(),
        date: today(),
        type: 'route-state',
        criterion: 'estado',
        name: `Ruta ${r.num}: ${r.state}`,
        evidence,
        routeId: id
      });
      renderRutas();
    }
  });
}

function adjustWeight(id, delta) {
  const routes = DB.get('routes', ROUTES_DEFAULT);
  const r = routes.find(x => x.id === id);
  if (!r) return;
  r.weight = Math.max(0, Math.min(100, r.weight + delta));
  DB.set('routes', routes);
  renderRutas();
}

function cycleAppStatus(idx) {
  const apps = DB.get('applications', APPLICATIONS_DEFAULT);
  const a = apps[idx];
  if (!a) return;
  const cycle = ['target', 'applied', 'interview', 'offer', 'rejected', 'ghosted'];
  const i = cycle.indexOf(a.status);
  const next = cycle[(i + 1) % cycle.length];
  a.status = next;
  if (!a.date && next !== 'target') a.date = today();
  DB.update('applications', idx, a);
  renderRutas();
}

function addApplication() {
  const company = prompt('Empresa:');
  if (!company) return;
  const position = prompt('Posición:') || '';
  const country = (prompt('País (US / MX):', 'US') || 'US').toUpperCase();
  const notes = prompt('Notas (opcional):') || '';
  DB.push('applications', {
    id: 'app-' + uid(),
    company, position,
    country: country === 'MX' ? 'MX' : 'US',
    date: '', status: 'target', notes
  });
  renderRutas();
}

function renderFlow() {
  const v = document.getElementById('view-flow');

  const expense = DB.get('flow:expense', []);

  const mk = monthKey();
  const fx = fxRates[mk] || fxRates.default;

  // Aggregates this month
  const monthIncome = income.filter(i => monthKey(new Date(i.date + 'T00:00:00')) === mk);
  const monthExpense = expense.filter(e => monthKey(new Date(e.date + 'T00:00:00')) === mk);
  const totalIn = monthIncome.reduce((s, i) => s + (i.amountMXN || 0), 0);
  const totalOut = monthExpense.reduce((s, e) => s + (e.amountMXN || 0), 0);
  const savings = totalIn - totalOut;

  // Last 12 months history
  const last12 = getLastNMonths(12).reverse();
  const history = last12.map(m => {
    const inMo = income.filter(i => monthKey(new Date(i.date + 'T00:00:00')) === m).reduce((s, i) => s + (i.amountMXN || 0), 0);
    const outMo = expense.filter(e => monthKey(new Date(e.date + 'T00:00:00')) === m).reduce((s, e) => s + (e.amountMXN || 0), 0);
    return { m, in: inMo, out: outMo, save: inMo - outMo };

    cat: c.name,
    total: monthExpense.filter(e => e.category === c.name).reduce((sum, e) => sum + (e.amountMXN || 0), 0)

      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px;">
        <div>
          <div class="kpi-num money" style="color:var(--ok);font-size:18px;">${symbol}${Math.round(conv(totalIn)).toLocaleString('en-US')}</div>
          <div class="kpi-label">Ingreso</div>
        </div>
        <div>
          <div class="kpi-num money" style="color:var(--miss);font-size:18px;">${symbol}${Math.round(conv(totalOut)).toLocaleString('en-US')}</div>
          <div class="kpi-label">Gasto</div>
        </div>
        <div>
          <div class="kpi-num money" style="color:var(--gold);font-size:18px;">${symbol}${Math.round(conv(savings)).toLocaleString('en-US')}</div>
          <div class="kpi-label">Ahorro · ${savingsPct}%</div>
        </div>
      </div>
    </div>

    <!-- Por fuente de ingreso -->
    ${bySource.length > 0 ? `
      <div class="card">
        <div class="card-head">
          <div class="card-title font-serif">Por fuente</div>
          <div class="card-meta">${bySource.length}</div>
        </div>
        ${bySource.map(s => `
          <div class="row">
            <div class="row-main">
              <div class="row-name">${s.source}</div>
              <div class="row-meta">${totalIn > 0 ? Math.round((s.total / totalIn) * 100) : 0}% del ingreso</div>
            </div>
            <div class="row-side">
              <div class="money">${symbol}${Math.round(conv(s.total)).toLocaleString('en-US')}</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <!-- Por categoría de gasto -->
    ${byCat.length > 0 ? `
      <div class="card">
        <div class="card-head">
          <div class="card-title font-serif">Gasto por categoría</div>
          <div class="card-meta">${byCat.length}</div>
        </div>
        ${byCat.map(c => `
          <div class="row">
            <div class="row-main">
              <div class="row-name">${c.cat}</div>
              <div class="row-meta">${totalOut > 0 ? Math.round((c.total / totalOut) * 100) : 0}%</div>
            </div>
            <div class="row-side">
              <div class="money">${symbol}${Math.round(conv(c.total)).toLocaleString('en-US')}</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <!-- Histórico 12 meses -->
    <div class="card">
      <div class="card-head">
        <div class="card-title font-serif">Histórico · 12 meses</div>
        <div class="card-meta">tendencia</div>
      </div>
      ${history.map(h => {
        const max = Math.max(...history.map(x => x.in));
        const inPct = max > 0 ? (h.in / max) * 100 : 0;
        const outPct = max > 0 ? (h.out / max) * 100 : 0;
        return `
          <div style="margin:10px 0;">

          </div>

  const fx = getFxRate();

  // Group by phase
  const phaseOrder = ['F1', 'F2', 'F3', 'F4'];
  const grouped = phaseOrder.map(p => ({
    phase: p,
    items: list.filter(w => w.phase === p)
  })).filter(g => g.items.length > 0);

  const totalCurrentPhaseUSD = list.filter(w => w.phase === phase.code).reduce((s, w) => {
    if (w.sale) return s;
    if (w.costUSD) return s + w.costUSD;
    if (w.costMXN) return s + w.costMXN / fx;
    return s;
  }, 0);

  v.innerHTML = `
    <div class="sec-head">
      <div class="sec-title font-serif">Wishlist</div>
      <div class="sec-sub">items · costo · ETA · fase · tag</div>
      <div class="sec-rule"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title font-serif">Total ${phase.code}</div>
          <div class="card-sub">${list.filter(w => w.phase === phase.code).length} items</div>
        </div>
        <div class="card-meta">$${Math.round(totalCurrentPhaseUSD).toLocaleString('en-US')} USD</div>
      </div>
    </div>

    ${grouped.map(g => `
      <div class="sec-head" style="margin-top:24px;">
        <div class="sec-title font-serif" style="font-size:18px;">${g.phase}</div>
        <div class="sec-sub">${g.items.length} item${g.items.length === 1 ? '' : 's'}</div>
      </div>
      <div class="card">
        ${g.items.map((w, gIdx) => {
          const idx = list.indexOf(w);
          const costStr = w.costRange ? w.costRange : (w.costUSD ? '$' + w.costUSD.toLocaleString('en-US') + ' USD' : (w.costMXN ? '$' + w.costMXN.toLocaleString('es-MX') + ' MXN' : (w.sale ? 'venta' : '—')));
          const dleft = w.eta ? daysFromNow(w.eta) : null;
          const etaCls = dleft != null ? (dleft < 0 ? 'urgent' : (dleft < 30 ? '' : 'muted')) : 'muted';
          return `
            <div class="wish-item" onclick="editWish(${idx})">
              <div class="row-main">
                <div class="wish-name">${w.name}</div>
                <div class="wish-meta">${w.tag || ''}${w.funding ? ' · ' + w.funding : ''}</div>
              </div>
              <div class="row-side">
                <div class="wish-cost">${costStr}</div>
                <div class="wish-eta ${etaCls}">${w.eta ? fmtDate(w.eta) + (dleft != null ? ' · ' + (dleft >= 0 ? 'en ' + dleft + 'd' : 'vencido') : '') : '—'}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `).join('')}

    <button class="btn-add" onclick="addWish()" style="margin-top:14px;">+ Item nuevo</button>
  `;
}

function editWish(idx) {
  const list = DB.get('wishlist', WISHLIST_F1_DEFAULT);
  const w = list[idx];
  if (!w) return;
  const action = prompt(`${w.name}: editar / eliminar (e / d):`, 'e');
  if (!action) return;
  if (action.toLowerCase() === 'd') {
    if (!confirm('¿Eliminar de wishlist?')) return;
    DB.remove('wishlist', idx);
  } else {
    const eta = prompt('ETA (YYYY-MM-DD):', w.eta || '') || w.eta;
    const phaseStr = (prompt('Fase (F1/F2/F3/F4):', w.phase || 'F1') || 'F1').toUpperCase();
    DB.update('wishlist', idx, { eta, phase: phaseStr });
  }
  renderWishlist();
  renderHome();
}

function addWish() {
  const name = prompt('Nombre:');
  if (!name) return;
  const currency = (prompt('Moneda (MXN / USD):', 'MXN') || 'MXN').toUpperCase();
  const cost = parseFloat(prompt('Costo:')) || 0;
  const eta = prompt('ETA (YYYY-MM-DD, opcional):') || '';
  const phase = (prompt('Fase (F1/F2/F3/F4):', 'F1') || 'F1').toUpperCase();
  const tag = prompt('Tag (personal / hollywood / liquidez / deuda / etc.):') || 'personal';
  DB.push('wishlist', {
    id: uid(),
    name,
    costMXN: currency === 'MXN' ? cost : null,
    costUSD: currency === 'USD' ? cost : null,
    eta, phase, tag
  });
  renderWishlist();
  renderHome();
}

        ${isRouteChange ? '' : `

          <div class="placebo-opt" onclick="selectPlaceboOpt('cobranza')">

            <div class="placebo-opt-desc">Dinero que llegó. Monto + fuente. Verificable en cuenta.</div>

          </div>
          <div class="placebo-opt" onclick="selectPlaceboOpt('activo')">
            <div class="placebo-opt-name">Activo material creado</div>
            <div class="placebo-opt-desc">Cosa nueva en el mundo. URL · streak · post enviado.</div>
          </div>
        </div>
        `}

        ${isRouteChange ? `
          <div style="margin-top:14px;">
            <label class="form-label">Evidencia · qué pasó (concreto)</label>
            <textarea id="placebo-evidence" class="form-input" placeholder="Mandé email a X. Recibí respuesta de Y. Llamada agendada para Z."></textarea>
          </div>
        ` : `
          <div id="placebo-form" style="margin-top:14px;display:none;">
            <div id="placebo-fields"></div>
            <label class="form-label" style="margin-top:10px;">Evidencia (concreta · sin verbos vagos)</label>
            <textarea id="placebo-evidence" class="form-input" placeholder="URL · monto · streak · cita textual · etc."></textarea>
          </div>
        `}

        <div class="placebo-warn">

        </div>

          <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Cancelar</button>

        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
  window._placeboState = { onConfirm, routeId, fromState, toState, criterion: isRouteChange ? 'estado' : null };
}

function selectPlaceboOpt(criterion) {
  const opts = document.querySelectorAll('.placebo-opt');
  opts.forEach(o => o.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  window._placeboState.criterion = criterion;

  // Render appropriate fields
  const fields = document.getElementById('placebo-fields');
  if (criterion === 'cobranza') {
    fields.innerHTML = `
      <label class="form-label">Monto</label>
      <input type="number" id="placebo-amount" class="form-input" placeholder="ej. 5000">
      <label class="form-label" style="margin-top:8px;">Moneda</label>
      <select id="placebo-currency" class="form-input">
        <option value="MXN">MXN</option>
        <option value="USD">USD</option>
      </select>
      <label class="form-label" style="margin-top:8px;">Fuente · de dónde vino</label>
      <input type="text" id="placebo-source" class="form-input" placeholder="ej. Rappi · bono Q2">
    `;
  } else if (criterion === 'activo') {
    fields.innerHTML = `
      <label class="form-label">Tipo · qué es</label>
      <input type="text" id="placebo-name" class="form-input" placeholder="ej. Newsletter post #3 publicado">
      <label class="form-label" style="margin-top:8px;">URL / streak</label>
      <input type="text" id="placebo-source" class="form-input" placeholder="ej. https://substack.com/p/... · streak 3">
    `;
  } else {
    fields.innerHTML = `
      <label class="form-label">Detalle</label>
      <input type="text" id="placebo-name" class="form-input" placeholder="ej. Aplicación enviada a Amazon Ads">
    `;
  }
  document.getElementById('placebo-form').style.display = 'block';
  document.getElementById('placebo-confirm').disabled = false;
}

function confirmPlacebo() {
  const state = window._placeboState;
  if (!state || !state.criterion) {
    alert('Selecciona un criterio.');
    return;
  }
  const evidence = document.getElementById('placebo-evidence').value.trim();
  if (!evidence || evidence.length < 10) {
    alert('Evidencia muy corta. Sé concreto: qué pasó, dónde, cuándo, cuánto. Mínimo 10 caracteres.');
    return;
  }
  // Detect vague verbs
  const vague = ['trabaj', 'avanc', 'pens', 'reflex', 'ide', 'plane'];
  const lower = evidence.toLowerCase();
  if (vague.some(v => lower.startsWith(v) || lower.includes(' ' + v))) {
    if (!confirm('Tu evidencia parece incluir verbos vagos ("trabajé", "avancé"). ¿Es realmente un acelerador material? Cancelar para ajustar.')) return;
  }

  const extra = {};
  if (state.criterion === 'cobranza') {
    extra.amount = parseFloat(document.getElementById('placebo-amount')?.value) || 0;
    extra.currency = document.getElementById('placebo-currency')?.value || 'MXN';
    extra.source = document.getElementById('placebo-source')?.value || '';
    extra.name = `Cobranza · ${extra.source || 'fuente'}`;
  } else if (state.criterion === 'activo') {
    extra.name = document.getElementById('placebo-name')?.value || 'Activo';
    extra.source = document.getElementById('placebo-source')?.value || '';
  } else if (state.criterion === 'estado' && !state.routeId) {
    extra.name = document.getElementById('placebo-name')?.value || 'Cambio estado';
  }
  closeModal();
  state.onConfirm(state.criterion, evidence, extra);
}

function qcDebtPayment() {
  const debts = DB.get('debts', DEBTS_DEFAULT).filter(d => !d.paid);
  if (debts.length === 0) {
    alert('Sin deudas activas.');
    closeModal();
    return;
  }
  const list = debts.map((d, i) => `${i + 1}. ${d.name} · $${(d.amountMXN || 0).toLocaleString('es-MX')}`).join('\n');
  const sel = parseInt(prompt('Deuda:\n\n' + list + '\n\nNúmero:')) - 1;
  if (isNaN(sel) || sel < 0 || sel >= debts.length) return;
  const allDebts = DB.get('debts', DEBTS_DEFAULT);
  const realIdx = allDebts.indexOf(debts[sel]);
  const action = prompt('Acción: "pagar" total · o monto del abono parcial', 'pagar');
  if (!action) return;
  if (action.toLowerCase() === 'pagar') {
    allDebts[realIdx].paid = true;
    allDebts[realIdx].amountMXN = 0;
  } else {
    const num = parseFloat(action);
    if (isNaN(num) || num <= 0) return;
    allDebts[realIdx].amountMXN = Math.max(0, allDebts[realIdx].amountMXN - num);
    if (allDebts[realIdx].amountMXN === 0) allDebts[realIdx].paid = true;
  }
  DB.set('debts', allDebts);
  closeModal();
  alert('Deuda actualizada.');
  if (document.getElementById('view-stack').classList.contains('active')) renderStack();
}

const VIEWS = ['home', 'fases', 'rutas', 'aceleradores', 'flow', 'stack', 'wishlist', 'arquitecto'];

  home: 'Capital · Rutas · Sistema',

function navigate(view) {
  VIEWS.forEach(v => document.getElementById('view-' + v).classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');

  if (tabEl) tabEl.classList.add('active');

}

function renderView(view) {
  if (view === 'home') renderHome();
  else if (view === 'fases') renderFases();
  else if (view === 'rutas') renderRutas();
  else if (view === 'aceleradores') renderAceleradores();
  else if (view === 'flow') renderFlow();

function toggleBg(el) {

/* ============================================================
   EXPORT / IMPORT · namespace bil:
   ============================================================ */
function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('bil:')) {
      data[key] = localStorage.getItem(key);
    }
  }
  const payload = {
    app: 'protocolo-billonario',
    version: VERSION,
    exportedAt: new Date().toISOString(),
    data
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `billonario-backup-${today()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.data) throw new Error('Formato inválido — falta campo "data"');
      const keys = Object.keys(parsed.data);
      if (!keys.some(k => k.startsWith('bil:'))) throw new Error('Este backup no es de Protocolo Billonario MV');
      // Verificar que el JSON contiene bil:version
      if (!keys.includes('bil:version') && !parsed.version) {
        throw new Error('Backup sin bil:version — formato no reconocido');
      }
      const dateStr = parsed.exportedAt ? parsed.exportedAt.slice(0, 10) : '?';
      const verStr = parsed.version || JSON.parse(parsed.data['bil:version'] || '"?"');
      if (!confirm(`Esto sobrescribe TODOS los datos actuales con backup del ${dateStr} (v${verStr}). ¿Continuar?`)) return;
      const toRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('bil:')) toRemove.push(k);
      }
      toRemove.forEach(k => localStorage.removeItem(k));
      Object.entries(parsed.data).forEach(([k, v]) => {
        localStorage.setItem(k, v);
      });
      alert('Datos importados correctamente. Recargando...');
      location.reload();
    } catch (err) {
      alert('Error al importar: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm('¿Borrar TODOS los datos de Billonario? Esto NO se puede deshacer.')) return;
  if (!confirm('Última oportunidad. ¿Realmente borrar todo? Exporta antes si no lo has hecho.')) return;
  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('bil:')) toRemove.push(k);
  }
  toRemove.forEach(k => localStorage.removeItem(k));
  location.reload();
}

/* ============================================================
   SERVICE WORKER
   ============================================================ */
function tryRegisterSW() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').catch(() => {
    // sin SW está bien, app funciona online normal
  });
}

function updateSwStatus() {
  const el = document.getElementById('swStatus');
  if (!el) return;
  if (!('serviceWorker' in navigator)) {
    el.textContent = 'no soportado en este navegador';
    return;
  }
  navigator.serviceWorker.getRegistration().then(reg => {
    if (reg) {
      el.textContent = 'activo · offline disponible';
      el.style.color = 'var(--ok)';
    } else {
      el.textContent = 'no registrado · descarga sw.js abajo';
    }
  });
}

function downloadSW() {
  const swCode = `// Billonario PWA · Service Worker
// Súbelo al mismo folder que protocolo-billonario.html en tu repo
const CACHE = 'billonario-v1';
const ASSETS = [
  './',
  './protocolo-billonario.html'
];

self.addEventListener('install', (e) => {
  e.waitUntil(
    caches.open(CACHE).then((c) => c.addAll(ASSETS).catch(() => {}))
  );
  self.skipWaiting();
});

self.addEventListener('activate', (e) => {
  e.waitUntil(
    caches.keys().then((keys) =>
      Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (e) => {
  if (e.request.method !== 'GET') return;
  const url = new URL(e.request.url);
  const sameOrigin = url.origin === self.location.origin;
  const isFonts = url.hostname.includes('fonts.googleapis.com') || url.hostname.includes('fonts.gstatic.com');
  if (!sameOrigin && !isFonts) return;

  e.respondWith(
    caches.match(e.request).then((cached) => {
      const fetchAndCache = fetch(e.request).then((resp) => {
        if (resp && resp.ok) {
          const clone = resp.clone();
          caches.open(CACHE).then((c) => c.put(e.request, clone));
        }
        return resp;
      }).catch(() => cached);
      if (e.request.destination === 'document') {
        return fetchAndCache.catch(() => cached);
      }
      return cached || fetchAndCache;
    })
  );
});`;

  const blob = new Blob([swCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sw.js';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}
